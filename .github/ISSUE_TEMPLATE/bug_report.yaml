name: Bug Report
description: Report a bug or unexpected behavior.
title: "[BUG]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug.

        Please provide as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Describe the issue.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: List the exact steps.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should happen?
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Affected Module
      options:
        - Auth
        - Resources
        - Profile
        - Placement
        - Admin
        - Shared
        - API
        - Database
        - Frontend
        - Backend
    validations:
      required: true

  - type: input
    id: requirement
    attributes:
      label: Related SRS Requirement (Optional)
      placeholder: REQ-8

  - type: textarea
    id: logs
    attributes:
      label: Logs / Stack Trace
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images if applicable.

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Chrome 139, Node 22

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues first.
          required: true
        - label: I can reproduce this issue consistently.
          required: true
