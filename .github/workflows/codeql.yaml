name: CodeQL

on:
  push:
    branches:
      - master
      - develop

  pull_request:
    branches:
      - develop
      - master

  schedule:
    - cron: "0 3 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        language:
          - javascript

    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Upgrade npm to match devEngines
        run: sudo npm install -g npm@11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: github/codeql-action/analyze@v4
