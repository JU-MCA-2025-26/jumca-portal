name: Close Stale Issues

on:
  schedule:
    - cron: "0 2 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/stale@v11

        with:
          stale-issue-message: >
            This issue has been automatically marked as stale because it has had no activity for 30 days.

          close-issue-message: >
            Closing this issue due to inactivity.

          stale-pr-message: >
            This pull request has been marked as stale because it has had no activity for 30 days.

          close-pr-message: >
            Closing this pull request due to inactivity.

          days-before-stale: 30

          days-before-close: 7
