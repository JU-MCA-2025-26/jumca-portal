name: Lint

on:
  pull_request:

  push:
    branches:
      - develop
      - master

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Upgrade npm to match devEngines
        run: sudo npm install -g npm@11.16.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check
